name: secret-scan

# Security review DATA-888 (plan v1.3 §4). Runs the open-source gitleaks CLI
# directly (gitleaks-action needs a paid licence for organisation repos).
#   * every push to any branch and every pull request, plus a weekly run;
#   * full history (fetch-depth: 0), not just the diff;
#   * pinned release, verified against its published SHA-256 before use;
#   * the repo's .gitleaks.toml (custom GCP service-account rules) and
#     .gitleaks-baseline.json (known historical findings, each one reviewed and
#     recorded in docs/security/FINDINGS_TRACKER.md).
# Hard-fails on any NEW finding. Output is redacted.

on:
  push:
  pull_request:
  schedule:
    - cron: '17 4 * * 1'   # Mondays 04:17 UTC — catches rule updates against old history
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Install gitleaks (pinned + checksum-verified)
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Prove the custom GCP rules still fire (JSON / YAML / TOML / .env / k8s)
        run: bash scripts/gitleaks-selftest.sh

      - name: Scan full git history
        run: |
          gitleaks git . \
            --config .gitleaks.toml \
            --baseline-path .gitleaks-baseline.json \
            --redact \
            --verbose \
            --no-banner \
            --exit-code 1
