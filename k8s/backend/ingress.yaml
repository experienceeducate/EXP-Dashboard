apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: exp-dashboard-api
  namespace: data-ingestion
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/limit-rps: "10"
    nginx.ingress.kubernetes.io/proxy-body-size: "2m"
    # Must stay ABOVE the heaviest route's own query timeout
    # (routers/elab.py's _QUERY_TIMEOUT_SECONDS, 60s) so the app answers a
    # stuck query before nginx does. nginx's own 504 is generated by the
    # ingress, not FastAPI, so it carries no CORS headers — the browser
    # discards it and the dashboard reports an opaque "Failed to fetch"
    # instead of the real status. Default is 60s, which the E-Lab
    # summary-by-cu query could exceed.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
spec:
  tls:
    - hosts:
        - exp-dashboard-api.educateapps.work
      secretName: exp-dashboard-api-tls
  rules:
    - host: exp-dashboard-api.educateapps.work
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: exp-dashboard-server
                port:
                  number: 80
