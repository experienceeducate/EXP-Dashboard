server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # SPA: no client-side router, but deep links / refresh still resolve to index.
    #
    # index.html must NOT be cached. It is the only unfingerprinted file served
    # here, and it carries the <script src> pointing at the hashed bundle below.
    # With no Cache-Control nginx sends only ETag/Last-Modified, so a browser
    # applies heuristic freshness and can keep serving a stale index.html —
    # which references the PREVIOUS deploy's bundle name. The new JS then sits
    # on the server unreferenced and the user sees the old app until they hard
    # reload. Observed after the #44 deploy: the rollout was green and
    # /assets/index-C9_XZiea.js was live, but browsers held the old index.
    #
    # `no-cache` (revalidate before reuse), not `no-store` (never store): the
    # ETag above still yields a cheap 304 when the file genuinely hasn't
    # changed, so this costs one conditional request per page load, not a
    # re-download.
    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }

    # Long-cache fingerprinted assets.
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
